name: CI

on:
  # Also validate stacked PRs whose base is another feature branch.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/market-data-service/requirements*.txt
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          python -m venv services/market-data-service/.venv
          services/market-data-service/.venv/bin/python -m pip install -r services/market-data-service/requirements-dev.txt
      - name: Check application
        run: npm run check
      - name: Build frontend
        run: npm run build:web
