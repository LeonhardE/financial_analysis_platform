name: CI

on:
  # Also validate stacked PRs whose base is another feature branch.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/requirements-dev.txt
            services/*/requirements*.txt
            services/common/pyproject.toml
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          python -m venv services/market-data-service/.venv
          services/market-data-service/.venv/bin/python -m pip install -r services/requirements-dev.txt
      - name: Check application
        run: npm run check
      - name: Build frontend
        run: npm run build:web

  backend-images:
    name: Backend image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [market-data-service, user-service, config-service]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build independent backend image
        run: docker build --file services/${{ matrix.service }}/Dockerfile --tag folioview-backend:test .
      - name: Check isolated runtime health
        run: |
          docker run --detach --name service-smoke --env MARKET_DATA_SOURCE=mock folioview-backend:test
          docker exec -i service-smoke python - <<'PY'
          import json
          import time
          from urllib.request import urlopen
          for attempt in range(40):
              try:
                  with urlopen("http://127.0.0.1:8080/health", timeout=1) as response:
                      assert json.load(response)["status"] == "ok"
                  break
              except OSError:
                  if attempt == 39:
                      raise
                  time.sleep(0.25)
          PY
      - name: Show startup failure details
        if: failure()
        run: docker logs service-smoke || true
      - name: Stop runtime
        if: always()
        run: docker rm --force service-smoke || true
