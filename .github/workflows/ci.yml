name: CI

on:
  # Keep the workflow unfiltered so the required aggregate also completes for docs-only PRs.
  # Stacked PRs compare against their actual base, including another feature branch.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.plan.outputs.web }}
      backend: ${{ steps.plan.outputs.backend }}
      services: ${{ steps.plan.outputs.services }}
      infra: ${{ steps.plan.outputs.infra }}
      terraform: ${{ steps.plan.outputs.terraform }}
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from changed paths
        id: plan
        run: python3 scripts/ci/checks.py detect

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js for repository formatting
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Install root tooling without frontend workspace dependencies
        run: npm ci --ignore-scripts --workspaces=false
      - name: Check repository formatting
        run: npm run format:check:web
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test CI selection and required-check aggregation
        run: python -m unittest discover -s scripts/ci/tests -v
      - name: Install infrastructure linter
        if: needs.changes.outputs.infra == 'true'
        run: python -m pip install 'ruff>=0.12,<1.0'
      - name: Check repository Python tooling and deployment guards
        if: needs.changes.outputs.infra == 'true'
        run: |
          ruff check --config services/market-data-service/pyproject.toml scripts infra/gcp
          ruff format --check --config services/market-data-service/pyproject.toml scripts infra/gcp
          python -m unittest discover -s infra/gcp/tests -v

  web:
    name: Web client
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Check frontend types and behavior
        run: |
          npm run typecheck:web
          npm run test:web
      - name: Build frontend
        run: npm run build:web

  backend:
    name: Service checks (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: changes
    # Job conditions run before matrix expansion, so an empty selection is safe.
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements*.txt
            services/common/pyproject.toml
      - name: Install only this service's dependencies
        env:
          SERVICE: ${{ matrix.service }}
        run: python -m pip install -r "services/$SERVICE/requirements-dev.txt" ./services/common
      - name: Check this service and its shared library
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          # Preserve root npm run check rules as well as service-specific rules.
          ruff check --config services/market-data-service/pyproject.toml "services/$SERVICE" services/common
          ruff format --check --config services/market-data-service/pyproject.toml "services/$SERVICE" services/common
          if [ "$SERVICE" != market-data-service ]; then
            ruff check --config "services/$SERVICE/pyproject.toml" "services/$SERVICE" services/common
            ruff format --check --config "services/$SERVICE/pyproject.toml" "services/$SERVICE" services/common
          fi
          python scripts/test_services.py --service common --service "$SERVICE"
      - name: Build independent backend image
        env:
          SERVICE: ${{ matrix.service }}
        run: docker build --file "services/$SERVICE/Dockerfile" --tag folioview-backend:test .
      - name: Check isolated runtime health
        run: |
          docker run --detach --name service-smoke --env MARKET_DATA_SOURCE=mock folioview-backend:test
          docker exec -i service-smoke python - <<'PY'
          import json
          import time
          from urllib.request import urlopen
          for attempt in range(40):
              try:
                  with urlopen("http://127.0.0.1:8080/health", timeout=1) as response:
                      assert json.load(response)["status"] == "ok"
                  break
              except OSError:
                  if attempt == 39:
                      raise
                  time.sleep(0.25)
          PY
      - name: Show startup failure details
        if: failure()
        run: docker logs service-smoke || true
      - name: Stop runtime
        if: always()
        run: docker rm --force service-smoke || true

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install verified Terraform tooling
        run: python infra/gcp/terraform_tools.py install --directory "$RUNNER_TEMP/terraform-tools"
      - name: Validate Terraform without cloud credentials
        run: python infra/gcp/terraform_tools.py check --terraform "$RUNNER_TEMP/terraform-tools/terraform"

  quality:
    # Keep this exact name: existing branch protection requires it.
    name: Quality checks
    runs-on: ubuntu-latest
    needs: [changes, repository, web, backend, terraform]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Require successful checks for every selected target
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/checks.py gate
