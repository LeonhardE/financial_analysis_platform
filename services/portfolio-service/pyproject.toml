[project]
name = "portfolio-service"
version = "0.1.0"
description = "Build-only Portfolio API skeleton for FolioView"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "folioview_shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
