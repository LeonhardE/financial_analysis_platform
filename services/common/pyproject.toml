[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "folioview-shared"
version = "0.1.0"
description = "Shared identity, HTTP and persistence primitives for FolioView services"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
include = ["folioview_shared*"]
