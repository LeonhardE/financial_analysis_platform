# A trusted main-branch trigger builds, pushes, and updates the existing service.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=services/market-data-service/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-api:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-api:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: python3
    args:
      - infra/gcp/deploy_existing_service.py
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --build-region=$LOCATION
      - --service=market-api
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-api:$BUILD_ID
      - --build-id=$BUILD_ID
      - --commit=$COMMIT_SHA
      - --branch=$BRANCH_NAME

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-api:$BUILD_ID

substitutions:
  _REGION: northamerica-northeast2
  _REPOSITORY: financial-analysis

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
