# Build the first image before creating this service in the Cloud Run Console.
# Set _DEPLOY_SERVICE=true only after its runtime identity, settings, and IAM are ready.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=services/config-service/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/config-api:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/config-api:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: python3
    args:
      - infra/gcp/deploy_existing_service.py
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --build-region=$LOCATION
      - --service=config-api
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/config-api:$BUILD_ID
      - --build-id=$BUILD_ID
      - --commit=$COMMIT_SHA
      - --branch=$BRANCH_NAME
      - --deploy-enabled=${_DEPLOY_SERVICE}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/config-api:$BUILD_ID

# The administrator-managed Config trigger supplies this deployment instance.
# Manual builds must provide both values explicitly; there is no owner fallback.
substitutions:
  _REGION: ""
  _REPOSITORY: ""
  _DEPLOY_SERVICE: "false"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
