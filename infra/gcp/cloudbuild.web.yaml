# These substitutions are public browser configuration, baked in when the image is built.
# Leave all four Firebase values empty to keep an anonymous-only deployment.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=apps/web/Dockerfile
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}
      - --build-arg=NEXT_PUBLIC_USER_API_BASE_URL=${_USER_API_BASE_URL}
      - --build-arg=NEXT_PUBLIC_CONFIG_API_BASE_URL=${_CONFIG_API_BASE_URL}
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-web:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-web:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: python3
    args:
      - infra/gcp/deploy_existing_service.py
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --build-region=$LOCATION
      - --service=market-web
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-web:$BUILD_ID
      - --build-id=$BUILD_ID
      - --commit=$COMMIT_SHA
      - --branch=$BRANCH_NAME

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-web:$BUILD_ID

substitutions:
  _REGION: northamerica-northeast2
  _REPOSITORY: financial-analysis
  _API_BASE_URL: ""
  # Leave empty during migration to keep private requests on the existing API.
  _USER_API_BASE_URL: ""
  _CONFIG_API_BASE_URL: ""
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_PROJECT_ID: ""
  _FIREBASE_APP_ID: ""

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
