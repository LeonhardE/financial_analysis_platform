# Trusted main only. This account cannot apply infrastructure or queue an apply build.
steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:8a50079dfc4b164aa5e83926bef5f9b305b93e80f82d40fabd836da4830dd08e
    entrypoint: /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3
    args:
      - infra/gcp/terraform_tools.py
      - install
      - --directory=/workspace/.terraform-tools
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:8a50079dfc4b164aa5e83926bef5f9b305b93e80f82d40fabd836da4830dd08e
    entrypoint: /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3
    args:
      - infra/gcp/terraform_pipeline.py
      - plan
      - --target=${_TARGET}
      - --build-id=$BUILD_ID
      - --commit=$COMMIT_SHA
      - --branch=$BRANCH_NAME
      - --project=$PROJECT_ID
      - --region=$LOCATION
      - --terraform=/workspace/.terraform-tools/terraform
      - --repair-controller=${_REPAIR_CONTROLLER}

substitutions:
  _TARGET: repo
  _REPAIR_CONTROLLER: ""

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
